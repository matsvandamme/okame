[platformio]
default_envs = okame

[common]
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11

[env:okame]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags = ${common.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=3
build_unflags = ${common.build_unflags}
monitor_speed = 115200
build_src_filter = +<*> -<sim/>
extra_scripts = pre:tools/pio_pre.py
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  ESP32Async/AsyncTCP@^3.4.0
  ESP32Async/ESPAsyncWebServer@^3.7.0
  bblanchon/ArduinoJson@^7.4.0

[env:native]
platform = native
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
test_build_src = no
extra_scripts = pre:tools/gen_pre.py

[env:sim]
platform = native
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
build_src_filter = -<*> +<sim/>
lib_compat_mode = off
extra_scripts = pre:tools/gen_pre.py
